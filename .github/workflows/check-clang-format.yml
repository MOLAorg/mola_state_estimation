name: CI clang-format

on: [push, pull_request]

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        # Github Actions requires a single row to be added to the build matrix.
        # See https://help.github.com/en/articles/workflow-syntax-for-github-actions.
        name: [
          clang-format-check
        ]

        include:
          - name: clang-format-check
            os: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@master

      - name: Git submodule
        run: |
          git submodule sync
          git submodule update --init --recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          pip install -r .github/python_clang_format_reqs.txt
          # clang-format 14 comes from PyPI; the lint script looks for "clang-format-14":
          mkdir -p "$HOME/bin"
          ln -sf "$(command -v clang-format)" "$HOME/bin/clang-format-14"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          "$HOME/bin/clang-format-14" --version

      - name: Check code style
        run: |
          echo "TASK=lint_all" >> $GITHUB_ENV
          bash .github/check_style.sh
