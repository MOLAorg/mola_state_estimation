# -----------------------------------------------------------------------------
#  DEMO: Fuse two ROS2 odometry sources in the MOLA StateEstimationSmoother
#
#  This mola-cli launch file subscribes to two nav_msgs/Odometry topics from
#  ROS2 (e.g. wheel encoder odometry + visual odometry), fuses them in the
#  sliding-window factor graph smoother, and publishes the fused result back
#  to ROS2 as nav_msgs/Odometry + /tf.
#
#  Usage:
#    mola-cli demo_fuse_two_ros2_odometries.yaml
#
#  Or via the companion ROS2 launch file (see ros2-launchs/).
#
#  Environment variables (with defaults):
#    ODOM1_TOPIC        - first odometry topic   (default: /wheel_odom)
#    ODOM2_TOPIC        - second odometry topic   (default: /visual_odom)
#    IMU_TOPIC          - IMU topic               (default: /imu)
#    GNSS_TOPIC         - GNSS topic              (default: /gps)
#    MOLA_WITH_GUI      - show MolaViz            (default: true)
# -----------------------------------------------------------------------------

modules:
  # =====================
  # MolaViz (optional)
  # =====================
  - name: viz
    type: mola::MolaViz
    enabled: ${MOLA_WITH_GUI|true}
    verbosity_level: INFO
    params: ~

  # =====================
  # State Estimation Smoother
  # =====================
  - name: state_estimation
    type: mola::mola_state_estimation_smoother::StateEstimationSmoother
    verbosity_level: ${MOLA_VERBOSITY_STATE_ESTIMATOR|INFO}
    raw_data_source: "ros2_bridge"

    # Rate at which the smoother publishes fused pose estimates to ROS2
    execution_rate: ${MOLA_STATE_ESTIMATOR_PUBLISH_RATE|20}  # Hz

    params:
      vehicle_frame_name: "${MOLA_TF_BASE_LINK|base_link}"
      reference_frame_name: "${MOLA_TF_MAP|map}"

      kinematic_model: "${MOLA_NAVSTATE_KINEMATIC_MODEL|KinematicModel::ConstantVelocity}"
      sliding_window_length: ${MOLA_NAVSTATE_SLIDING_WINDOW_SEC|2.5}
      min_time_difference_to_create_new_frame: 0.01
      max_time_to_use_velocity_model: 0.75

      # Anchor first pose near the map origin for local experiments:
      link_first_pose_to_reference_origin_sigma: 1e-6

      sigma_random_walk_acceleration_linear: ${MOLA_NAVSTATE_SIGMA_RANDOM_WALK_LINACC|1.0}
      sigma_random_walk_acceleration_angular: ${MOLA_NAVSTATE_SIGMA_RANDOM_WALK_ANGACC|10.0}
      sigma_integrator_position: 0.1
      sigma_integrator_orientation: 1.0

      enforce_planar_motion: ${MOLA_NAVSTATE_ENFORCE_PLANAR_MOTION|false}

      # Accept all odometry labels (both odom sources will arrive here):
      do_process_odometry_labels_re: ".*"
      do_process_imu_labels_re: ".*"
      do_process_gnss_labels_re: ".*"

      estimate_geo_reference: false
      additional_isam2_update_steps: 3

  # =====================
  # ROS2 <-> MOLA Bridge
  # =====================
  - name: ros2_bridge
    type: mola::BridgeROS2
    verbosity_level: ${MOLA_VERBOSITY_BRIDGE_ROS2|INFO}
    execution_rate: 20  # Hz

    params:
      base_link_frame: "${MOLA_TF_BASE_LINK|base_link}"
      base_footprint_frame: "${MOLA_TF_FOOTPRINT_LINK|base_footprint}"
      base_footprint_to_base_link_tf: "${MOLA_TF_FOOTPRINT_TO_BASE_LINK|[0, 0, 0, 0, 0, 0]}"
      odom_frame: "${MOLA_TF_ESTIMATED_ODOMETRY|odom}"
      reference_frame: "${MOLA_TF_MAP|map}"

      # The smoother publishes in "map" frame; direct mode is simpler:
      publish_localization_following_rep105: false

      # Publish fused estimates from the smoother only:
      publish_odometry_msgs_from_slam: true
      publish_odometry_msgs_from_slam_source: "state_estimation"
      publish_tf_from_slam: true
      publish_tf_from_slam_source: "state_estimation"

      publish_in_sim_time: ${MOLA_ROS2_PUBLISH_IN_SIM_TIME|false}
      period_publish_new_localization: 0.050  # 20 Hz check

      ros_args: '${ROS_ARGS|"[]"}'

      # ---- Subscribe to two odometry sources + optional IMU/GNSS ----
      subscribe:
        # First odometry source (e.g., wheel encoders)
        - topic: ${ODOM1_TOPIC|/wheel_odom}
          msg_type: Odometry
          output_sensor_label: "wheel_odom"

        # Second odometry source (e.g., visual/lidar odometry)
        - topic: ${ODOM2_TOPIC|/visual_odom}
          msg_type: Odometry
          output_sensor_label: "visual_odom"

        # Optional: IMU for gravity alignment
        - topic: ${IMU_TOPIC|/imu}
          msg_type: Imu
          output_sensor_label: "imu"
          fixed_sensor_pose: "0 0 0 0 0 0"
          use_fixed_sensor_pose: ${MOLA_USE_FIXED_IMU_POSE|false}

        # Optional: GNSS for geo-referencing
        - topic: ${GNSS_TOPIC|/gps}
          msg_type: NavSatFix
          output_sensor_label: "gps"
          fixed_sensor_pose: "0 0 0 0 0 0"
          use_fixed_sensor_pose: ${MOLA_USE_FIXED_GNSS_POSE|false}
